# ВАЖНО: этот compose поднимает ТОЛЬКО frontend (nginx + static UI).
# Полный стек (Flask + Supabase Auth/DB + AI) сюда НЕ входит —
# см. корневой README.md → «Быстрый старт» и «Для проверяющего».
#
# После `docker compose up` UI на http://localhost:8080 всё равно
# требует отдельно запущенный Flask (`VITE_API_BASE_URL`) и ключи Supabase.
name: qa-assistant

services:
  qa-assistant:
    build:
      context: ./qa-assistant
      dockerfile: Dockerfile
    image: qa-assistant:local
    container_name: qa-assistant
    ports:
      - "8080:80"
    restart: unless-stopped
