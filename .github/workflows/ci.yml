# QA Assistant — CI + auto-deploy Frontend to GitHub Pages (G2=B).
# API/AI remain local (Ollama). See integration_documentation.md §1.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-assistant
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: qa-assistant/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high+)
        run: npm audit --audit-level=high

      - name: Lint (oxlint)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build (tsc + Vite)
        run: npm run build

  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: testing
      PERSIST_BACKEND: memory
      EMBEDDING_PROVIDER: hash
      AI_PROVIDER: ollama
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools>=83' wheel
          pip install -r requirements-dev.txt

      - name: pip-audit (requirements.txt)
        run: pip-audit -r requirements.txt

      - name: Ruff lint
        run: ruff check app core infrastructure integrations wsgi.py

      - name: Ruff format check
        run: ruff format --check app core infrastructure integrations wsgi.py

      - name: Pytest (exclude Selenium ui/security)
        run: |
          python -m pytest tests/ \
            -m "not ui and not security" \
            --ignore=tests/test_ui_e2e.py \
            --ignore=tests/test_security.py \
            -q

  deploy:
    name: Deploy frontend (GitHub Pages)
    needs: [frontend, backend]
    # push to main OR manual workflow_dispatch (e.g. refresh VITE_API_BASE_URL)
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    defaults:
      run:
        working-directory: qa-assistant
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: qa-assistant/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        env:
          # Project-site path: https://<user>.github.io/Qa_Asistant/
          VITE_BASE_PATH: /Qa_Asistant/
          # Counter id is public; override via repo Variable if needed
          VITE_YANDEX_METRIKA_ID: "113444012"
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: SPA fallback for GitHub Pages (client routes)
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: qa-assistant/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
