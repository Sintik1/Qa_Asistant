# Keep Free-tier Supabase awake so Auth DNS does not go NXDOMAIN (~7 days idle).
# Secrets (repo Settings → Secrets): SUPABASE_URL, SUPABASE_ANON_KEY
# Optional: SUPABASE_ACCESS_TOKEN (PAT with project_admin_write) to auto-restore.

name: Supabase keepalive

on:
  schedule:
    - cron: "23 7 * * 2,5"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore if paused (optional PAT)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "No SUPABASE_ACCESS_TOKEN — skip restore"
            exit 0
          fi
          python3 scripts/supabase_keepalive.py --restore || true
      - name: Ping REST (resets idle pause timer)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Set secrets SUPABASE_URL and SUPABASE_ANON_KEY"
            exit 1
          fi
          python3 scripts/supabase_keepalive.py
