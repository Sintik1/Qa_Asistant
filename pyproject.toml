[project]
name = "qa-assistant-backend"
version = "0.0.0"
requires-python = ">=3.9"

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = [
  ".venv",
  "uploads",
  "qa-assistant",
  "tests/pages",
  "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "core", "infrastructure", "integrations"]
